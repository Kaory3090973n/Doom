<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base FPS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="tela"></canvas>
<div id="mira"></div>
<pre id="hud"></pre>

<!-- Tela inicial -->
<section id="telaInicio" class="tela">
  <h1>MAPA DE TESTES</h1>
  <div class="menu-botoes">
    <button id="btnJogar" class="largo destaque">JOGAR</button>
    <button id="btnTreino" class="largo">TREINAMENTO</button>
    <button id="btnArmas">ARMAS</button>
    <button id="btnPersonagens">PERSONAGENS</button>
    <button id="btnAtualizacoes">ATUALIZAÇÃO</button>
    <button id="btnOpcoes">OPÇÕES</button>
  </div>
  <p id="avisoInicio" class="aviso"></p>
  <span id="versao"></span>
</section>

<!-- Histórico de versões -->
<section id="telaAtualizacoes" class="tela oculto">
  <span class="sub">atualizações</span>
  <div id="listaUpdates" class="lista-updates"></div>
  <button id="btnVoltar">VOLTAR</button>
</section>

<!-- Pausa (Esc) -->
<section id="telaPausa" class="tela pausa oculto">
  <h1>PAUSADO</h1>
  <button id="btnContinuar">CONTINUAR</button>
  <p id="avisoPausa" class="aviso"></p>
</section>

<!-- Three.js (r149: última versão com build clássico, funciona abrindo o arquivo direto, sem servidor) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>')</script>
<script src="script.js"></script>
</body>
</html>
