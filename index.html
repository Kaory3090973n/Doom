<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Doom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="jogo" class="em-menu">
    <canvas id="tela"></canvas>

    <div id="hud">
      <div class="item"><span class="rotulo">VIDA</span><span id="hudVida">100</span></div>
      <div class="item"><span class="rotulo">MUNIÇÃO</span><span id="hudMunicao">30</span></div>
      <div class="item"><span class="rotulo">DEMÔNIOS</span><span id="hudInimigos">0</span></div>
    </div>

    <div id="danoFlash"></div>

    <!-- Tela inicial -->
    <div id="menu">
      <div id="menuPrincipal" class="tela-menu">
        <h1 class="menu-titulo">MINI DOOM</h1>
        <span id="menuVersao" class="menu-versao"></span>
        <nav class="menu-botoes">
          <button id="btnJogar" class="btn-menu">JOGAR</button>
          <button id="btnAtualizacao" class="btn-menu">ATUALIZAÇÕES</button>
        </nav>
        <p class="menu-dica">↑ ↓ navegar · enter escolher</p>
      </div>

      <div id="menuUpdates" class="tela-menu oculto">
        <h2 class="menu-subtitulo">ATUALIZAÇÕES</h2>
        <div id="listaUpdates" class="lista-updates"></div>
        <button id="btnVoltar" class="btn-menu">VOLTAR</button>
      </div>
    </div>

    <!-- Pausa / vitória / derrota -->
    <div id="overlay" class="oculto">
      <h1 id="titulo">MINI DOOM</h1>
      <p id="mensagem">Elimine todos os demônios do labirinto.</p>
      <ul id="controles">
        <li><b>W A S D</b> mover</li>
        <li><b>Mouse</b> mira livre (cima, baixo e lados)</li>
        <li><b>← →</b> girar &nbsp; <b>↑ ↓</b> olhar para cima/baixo</li>
        <li><b>Clique</b> ou <b>Espaço</b> atirar</li>
        <li><b>P</b> pausar</li>
      </ul>
      <button id="btnIniciar">JOGAR</button>
      <button id="btnMenu" class="btn-menu">MENU</button>
    </div>
  </div>

  <script src="atualizacoes.js"></script>
  <script src="game.js"></script>
</body>
</html>
